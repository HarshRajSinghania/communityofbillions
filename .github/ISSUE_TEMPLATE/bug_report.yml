name: Bug report
description: Something in the spec or the reference implementation is wrong.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A good bug report is the cheapest contribution there is.

        ⚠️ If this is a **security** issue, please stop and use
        [private vulnerability reporting](https://github.com/withinaz/communityofbillions/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/withinaz/communityofbillions/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command or code, and the full output.
      placeholder: |
        $ node packages/core/bin/cob.js verify --envelope ./msg.json
        ✘ COB_SIGNATURE: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Envelope / signing
        - Identity / keys
        - Payment messages
        - Policy / chain gating
        - Amount handling
        - CLI
        - Specification text
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node packages/core/bin/cob.js --version`
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This report contains no private keys or secrets.
          required: true
